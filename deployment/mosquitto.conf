# VeriMath Mosquitto MQTT Broker Configuration
# Place at /etc/mosquitto/conf.d/verimath.conf on Raspberry Pi

listener 1883 0.0.0.0
allow_anonymous true
persistence true
persistence_location /var/lib/mosquitto/
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
